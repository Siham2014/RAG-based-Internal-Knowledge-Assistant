project:
  name: internal_knowledge_assistant
  environment: development

corpus:
  company: azure
  processed_directory: data/processed
  chunks_path: data/chunks/fixed_1024_chunks.jsonl

chunking:
  strategy: fixed
  chunk_size: 1024
  overlap: 204

embedding:
  model_name: intfloat/e5-base-v2
  dimension: 768
  normalize: true
  query_prefix: "query: "
  document_prefix: "passage: "
  batch_size: 16
  device: auto

retrieval:
  vector_backend: pgvector
  lexical_backend: sqlite_fts5
  candidate_k: 50
  hybrid_top_k: 20
  final_top_k: 5
  rrf_constant: 60

reranking:
  enabled: true
  model_name: BAAI/bge-reranker-base
  batch_size: 4
  max_length: 512
  device: auto

confidence:
  enabled: true
  threshold: 0.30
  minimum_top1_score: 0.30
  minimum_margin: 0.00
  minimum_cosine_similarity: null
  minimum_rrf_score: 0.015
  minimum_supporting_results: 0

generation:
  enabled: true
  provider: qwen
  model_name: qwen3.8-max
  fallback_providers:
    - openai
  fallback_openai_model: gpt-5-nano
  inference_provider: null
  temperature: 0.0
  max_tokens: 512
  context_count: 2
  qwen:
    model_name: qwen3.8-max
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    enable_thinking: true
    thinking_budget: 128
    timeout_seconds: 60.0

query_processing:
  normalization:
    enabled: true
    provider: openai
    model_name: gpt-5-nano
    reasoning_effort: minimal
    temperature: 0.0
    max_tokens: 64

conversation:
  enabled: true
  max_conversations: 1000
  max_messages: 12
  max_context_messages: 4
  max_context_chars: 4000
  rewrite_max_tokens: 128

storage:
  bm25_index_path: indexes/lexical/bm25_index.db

api:
  host: 0.0.0.0
  port: 8000
